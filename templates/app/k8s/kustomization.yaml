# `kubectl apply -k k8s/` (dev) or Argo CD (prod) renders this directory.
# The namespace is NOT set here: dev deploys pass it (`kubectl -n dev-myproject apply -k k8s/`
# after `kubectl create ns dev-myproject`), and Argo CD sets it from the Application's
# destination.namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  # The tag to deploy. Use an immutable tag (the git SHA CI pushed), never "latest",
  # so Argo CD rolls out exactly what is committed. Update with:
  #   (cd k8s && kustomize edit set image registry.lab.kleincogroup.com/myproject/myapp:<sha>)
  - name: registry.lab.kleincogroup.com/myproject/myapp
    newTag: replace-with-git-sha
