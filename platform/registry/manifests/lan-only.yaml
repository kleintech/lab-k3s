# Who may talk to the unauthenticated, delete-enabled registry. The UDM does not isolate
# VLANs, so without this the IoT VLAN (192.168.2.0/24) could overwrite image tags.
# Allowed: Parent VLAN (this host + family PCs), Default VLAN, L2TP VPN, and cluster pods
# (CI runners hairpin via the node IP / svclb, so both 10.42/16 and the node IP are listed).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: registry
spec:
  ipAllowList:
    sourceRange:
      - 192.168.4.0/24
      - 192.168.1.0/24
      - 192.168.5.0/24
      - 10.42.0.0/16
