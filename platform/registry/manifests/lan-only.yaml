# Who may talk to the unauthenticated, delete-enabled registry. The UDM does not isolate
# VLANs by default, so without this any device on an untrusted VLAN could overwrite image tags.
# Allowed: the trusted LAN subnets, the VPN subnet, and cluster pods
# (CI runners hairpin via the node IP / svclb, so both 10.42/16 and the node IP are listed).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: registry
spec:
  ipAllowList:
    sourceRange:
      - 192.168.4.0/24
      - 192.168.1.0/24
      - 192.168.5.0/24
      - 10.42.0.0/16
