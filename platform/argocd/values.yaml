# argo/argo-cd chart, version pinned in argocd/apps/argocd.yaml (bootstrap/20-argocd.sh
# installs the same version with this file, then Argo CD takes itself over).
global:
  domain: argocd.lab.kleincogroup.com
  # platform/scheduling: Argo CD is what repairs everything else, so it ranks just below k3s itself.
  priorityClassName: lab-critical

configs:
  params:
    # TLS terminates at Traefik (wildcard cert); argocd-server speaks plain HTTP behind it.
    server.insecure: true
  cm:
    # Poll git every 60s so pushes to main land quickly (no webhook from GitHub to the LAN).
    timeout.reconciliation: 60s
    # Application health for app-of-apps. Without this, an Application child is always
    # "Healthy" to its parent, so the sync waves in argocd/apps/ (cert-manager -3 ->
    # issuers -2 -> traefik -1 -> rest 0) would not wait for the previous wave.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

server:
  pdb:
    enabled: true
    minAvailable: 1   # single replica: blocks voluntary eviction (drain, eviction API); node-pressure eviction ignores PDBs
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.lab.kleincogroup.com
    # `tls: true` in this chart hard-codes secretName argocd-server-tls, which does not
    # exist. Per CONVENTIONS the Ingress lists hosts only and Traefik serves the wildcard
    # from its default TLSStore, so the TLS block goes in via extraTls instead.
    tls: false
    extraTls:
      - hosts:
          - argocd.lab.kleincogroup.com
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi

controller:
  pdb:
    enabled: true
    minAvailable: 1   # single replica: blocks voluntary eviction (drain, eviction API); node-pressure eviction ignores PDBs
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

repoServer:
  pdb:
    enabled: true
    minAvailable: 1   # single replica: blocks voluntary eviction (drain, eviction API); node-pressure eviction ignores PDBs
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi

redis:
  pdb:
    enabled: true
    minAvailable: 1   # single replica: blocks voluntary eviction (drain, eviction API); node-pressure eviction ignores PDBs
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
