# jetstack/cert-manager chart, version pinned in argocd/apps/cert-manager.yaml.
global:
  priorityClassName: lab-critical   # platform/scheduling

crds:
  enabled: true
  keep: true   # uninstalling the chart must not delete Certificates cluster-wide

# DNS-01 self-checks must query public resolvers. The UDM answers *.lab.kleincogroup.com
# itself (split horizon), so the in-cluster resolver path can give answers that never
# match what Let's Encrypt sees for _acme-challenge records.
dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
dns01RecursiveNameserversOnly: true

# ServiceMonitor for the LabCertificate* alerts in platform/monitoring/values.yaml.
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    # Keep each certificate's own `namespace` label (kube-system) instead of having it
    # renamed to exported_namespace in favour of the scrape target's (cert-manager).
    honorLabels: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

startupapicheck:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
