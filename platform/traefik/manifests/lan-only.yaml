# Source-IP allow-list for the Traefik dashboard (no auth). Same ranges as platform/registry.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ipAllowList:
    sourceRange:
      - 192.168.4.0/24
      - 192.168.1.0/24
      - 192.168.5.0/24
      - 10.42.0.0/16
