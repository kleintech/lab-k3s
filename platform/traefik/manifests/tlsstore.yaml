# Default TLSStore: any router without its own cert gets the lab wildcard; SNI for
# *.kleincogroup.com picks the public-name wildcard. Secrets come from
# platform/cert-issuers (cert-manager, kube-system).
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-lab-kleincogroup-com
  certificates:
    - secretName: wildcard-kleincogroup-com
