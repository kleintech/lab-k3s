# kube-prometheus-stack values for the lab (single-node k3s on notatonix).
# Chart version is pinned in argocd/apps/monitoring.yaml (targetRevision).
# Upstream defaults: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml

# ---------------------------------------------------------------------------
# Control-plane components: disable their dedicated jobs on k3s.
# k3s runs the apiserver, scheduler, controller-manager, kubelet and kube-proxy in ONE
# process with ONE Prometheus registry. Every k3s metrics endpoint therefore serves all of their
# metrics (docs.k3s.io/reference/metrics), and they already reach us through the
# apiserver and kubelet jobs. The dedicated scheduler/controller-manager/kube-proxy
# endpoints are bound to 127.0.0.1, and single-server k3s uses SQLite (kine), not etcd. The
# chart's ServiceMonitors for them would find no targets, and their *Down alerts would
# fire forever. Disabling a component also drops its rules and dashboards.
# ---------------------------------------------------------------------------
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
# kube-apiserver and CoreDNS (k3s ships it as kube-dns with metrics on :9153) stay at the
# chart defaults (enabled).

kubelet:
  serviceMonitor:
    # The list replaces the chart default, so its csi/storage bucket drop is repeated here.
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      # k3s' shared registry makes the kubelet endpoint serve every apiserver/etcd(kine)
      # series too. The apiserver job already has them (with the chart's bucket drops), so
      # drop the unfiltered duplicates here. No rendered rule or dashboard reads
      # apiserver_*/etcd_* from job="kubelet" (checked against chart 92.1.0).
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver|etcd)_.*

kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true

# ---------------------------------------------------------------------------
# Grafana  (https://grafana.lab.kleincogroup.com)
# ---------------------------------------------------------------------------
grafana:
  priorityClassName: lab-platform   # platform/scheduling
  enabled: true
  admin:
    # Created by bootstrap/10-secrets.sh from ~/.config/lab-k3s/secrets.env.
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.lab.kleincogroup.com
    path: /
    # No secretName: Traefik's default TLSStore serves the *.lab.kleincogroup.com wildcard.
    tls:
      - hosts:
          - grafana.lab.kleincogroup.com
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    annotations:
      # local-path deletes the data with the claim. Keep Argo from pruning it if values change.
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
  # Grafana's SQLite DB lives on that RWO volume. Recreate keeps two pods from opening it at once during a rollout.
  deploymentStrategy:
    type: Recreate
  grafana.ini:
    server:
      root_url: https://grafana.lab.kleincogroup.com
    analytics:
      check_for_updates: false
      reporting_enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  # Dashboards: any ConfigMap labelled grafana_dashboard="1" in any namespace is loaded
  # (chart default: sidecar.dashboards.searchNamespace=ALL). See docs/observability.md.

# ---------------------------------------------------------------------------
# Prometheus
# ---------------------------------------------------------------------------
prometheus:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # cert-manager controller metrics for the LabCertificate* rules. It is declared here,
  # not in the cert-manager chart, so it is created in the same sync as the CRD
  # (see platform/cert-manager/values.yaml).
  additionalServiceMonitors:
    - name: cert-manager
      namespaceSelector:
        matchNames: [cert-manager]
      selector:
        matchLabels:
          app.kubernetes.io/name: cert-manager
          app.kubernetes.io/component: controller
      endpoints:
        - port: http-metrics
          path: /metrics
          interval: 60s
          # Keep each certificate's own `namespace` label (kube-system) instead of having
          # it renamed to exported_namespace in favour of the target's (cert-manager).
          honorLabels: true
  prometheusSpec:
    priorityClassName: lab-platform
    retention: 15d
    # Prometheus deletes the oldest blocks once the TSDB (WAL included) reaches this size.
    # Units are powers of 2, so this is 17GiB of the 20Gi request. local-path does not enforce
    # PVC sizes, so this cap is what actually keeps Prometheus from filling the host disk.
    retentionSize: 17GB
    # Without these, Prometheus only selects ServiceMonitors/PodMonitors/etc. that carry
    # this Helm release's label. With them set to false, it selects every one in any namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

# ---------------------------------------------------------------------------
# Alertmanager: warning + critical alerts are emailed through Gmail SMTP (docs/observability.md).
# ---------------------------------------------------------------------------
alertmanager:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  enabled: true
  # Replaces the chart's default config (which routed everything to a "null" receiver).
  # The inhibit rules are the chart defaults, repeated because the list is replaced whole.
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: lab-k3s alerts <kleintech@gmail.com>
      smtp_auth_username: kleintech@gmail.com
      # Gmail app password, from secret monitoring/alertmanager-smtp (bootstrap/10-secrets.sh),
      # mounted by alertmanagerSpec.volumes below. Read at send time, not at config load.
      smtp_auth_password_file: /etc/alertmanager/smtp/password
      smtp_require_tls: true
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: [namespace, alertname]
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: [namespace, alertname]
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: [namespace]
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      receiver: email
      group_by: [alertname, namespace]
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 12h
      routes:
        # Watchdog always fires by design (dead-man's switch); InfoInhibitor is plumbing.
        - receiver: 'null'
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        # info alerts are FYI only (e.g. CPUThrottlingHigh); see them in the AM UI / Grafana.
        - receiver: 'null'
          matchers: ['severity = info']
        - receiver: email
          matchers: ['severity = critical']
          repeat_interval: 4h
    receivers:
      - name: 'null'
      - name: email
        email_configs:
          - to: kleintech@gmail.com
            send_resolved: true
    templates:
      - '/etc/alertmanager/config/*.tmpl'
  alertmanagerSpec:
    priorityClassName: lab-platform
    # optional: true so a missing secret (fresh box before bootstrap/10-secrets.sh) costs
    # email delivery only, not the Alertmanager pod.
    volumes:
      - name: smtp
        secret:
          secretName: alertmanager-smtp
          optional: true
    volumeMounts:
      - name: smtp
        mountPath: /etc/alertmanager/smtp
        readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

prometheusOperator:
  priorityClassName: lab-platform
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# subcharts (platform/scheduling)
kube-state-metrics:
  priorityClassName: lab-platform
prometheus-node-exporter:
  priorityClassName: lab-platform

# ---------------------------------------------------------------------------
# Lab alert rules, on top of the chart's defaults (which already cover crash loops, failed
# jobs, NotReady pods/nodes, KubeletDown, filesystem space prediction, ...). These cover what
# a single-node box needs and the defaults don't: early disk/memory warnings, thrashing, and
# the platform's own failure states. Routing (what gets emailed) is alertmanager.config above.
# ---------------------------------------------------------------------------
additionalPrometheusRulesMap:
  lab-host:
    groups:
      - name: lab-host
        rules:
          # Live kubelet config (k3s defaults): image GC starts at 85% used, hard eviction
          # at nodefs/imagefs.available<5% (95% used). Warn before the first, critical before the second.
          - alert: LabDiskUsageHigh
            expr: 1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|vfat"} / node_filesystem_size_bytes > 0.80
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: 'Disk {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full'
              description: 'Over 80% used. Kubelet starts deleting images at 85% and evicting pods at 95%. Usual suspects: Prometheus TSDB, registry PVC, docker build cache, /var/lib/rancher/k3s/agent/containerd.'
          - alert: LabDiskUsageCritical
            expr: 1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|vfat"} / node_filesystem_size_bytes > 0.90
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: 'Disk {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full'
              description: 'Kubelet evicts pods at 95% used. Free space now.'
          - alert: LabMemoryLow
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: 'Only {{ $value | humanizePercentage }} of RAM available'
              description: 'MemAvailable has been under 10% for 10 minutes.'
          - alert: LabMemoryCritical
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
            for: 3m
            labels: {severity: critical}
            annotations:
              summary: 'Only {{ $value | humanizePercentage }} of RAM available'
              description: 'MemAvailable under 5% (~1.5 GiB): kubelet evicts pods at 1 GiB, and the OOM killer or swap thrashing is close.'
          # PSI "full": share of wall time in which every runnable task was stalled waiting on
          # memory (reclaim, swap-in). This is what thrashing actually is; used swap alone isn't
          # (idle pages can sit in swap for weeks without harm).
          - alert: LabMemoryThrashing
            expr: rate(node_pressure_memory_stalled_seconds_total[5m]) > 0.10
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: 'Box is thrashing: all tasks stalled on memory {{ $value | humanizePercentage }} of the time'
              description: 'Memory PSI full avg over 5m is above 10%. Find the hog: kubectl top pods -A --sort-by=memory'
          # 1000 pages/s = ~4 MB/s of sustained swap-in: memory is being paged back in faster
          # than it can stay resident. Earlier signal than PSI on a box with fast NVMe swap.
          - alert: LabSwapInHigh
            expr: rate(node_vmstat_pswpin[5m]) > 1000
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: 'Sustained swap-in at {{ $value | humanize }} pages/s'
              description: 'Working set no longer fits in RAM. Check kubectl top pods -A --sort-by=memory and the CI runners.'
  lab-cluster:
    groups:
      - name: lab-cluster
        rules:
          # The chart ships KubeNodePressure as severity info, which is not emailed.
          - alert: LabNodePressure
            expr: kube_node_status_condition{condition=~"DiskPressure|MemoryPressure|PIDPressure",status="true"} == 1
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: 'Node {{ $labels.node }} has {{ $labels.condition }}'
              description: 'Kubelet is evicting pods or about to.'
          - alert: LabContainerOOMKilled
            expr: |
              (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
              and on (namespace, pod, container)
              (increase(kube_pod_container_status_restarts_total[15m]) > 0)
            labels: {severity: warning}
            annotations:
              summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOMKilled'
              description: 'The container hit its memory limit and restarted. Raise the limit or fix the leak.'
          # Needs the Argo CD controller metrics (platform/argocd/values.yaml).
          - alert: LabArgoAppUnhealthy
            expr: argocd_app_info{health_status!="Healthy"} == 1
            for: 20m
            labels: {severity: warning}
            annotations:
              summary: 'Argo CD app {{ $labels.name }} is {{ $labels.health_status }}'
              description: 'Not Healthy for 20 minutes. https://argocd.lab.kleincogroup.com/applications/argocd/{{ $labels.name }}'
          - alert: LabArgoAppOutOfSync
            expr: argocd_app_info{sync_status!="Synced"} == 1
            for: 30m
            labels: {severity: warning}
            annotations:
              summary: 'Argo CD app {{ $labels.name }} is {{ $labels.sync_status }}'
              description: 'Not Synced for 30 minutes: a sync is failing or selfHeal is fighting something. https://argocd.lab.kleincogroup.com/applications/argocd/{{ $labels.name }}'
          # Needs the cert-manager ServiceMonitor (prometheus.additionalServiceMonitors above).
          # Let's Encrypt certs renew 30 days before expiry, so 14 days left means renewal is failing.
          - alert: LabCertificateExpiring
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
            for: 1h
            labels: {severity: warning}
            annotations:
              summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}'
              description: 'cert-manager should have renewed it already. kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}'
          - alert: LabCertificateNotReady
            expr: certmanager_certificate_ready_status{condition="False"} == 1
            for: 1h
            labels: {severity: warning}
            annotations:
              summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready'
              description: 'kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}'
