# Namespace-level guard rails for the runner pods (LimitRange). Wave 0, before arc-runners (1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners-ns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/kleintech/lab-k3s.git
    targetRevision: main
    path: platform/ci/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
